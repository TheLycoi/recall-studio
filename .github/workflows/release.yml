# Builds the plugin and drafts a GitHub release when a version tag is pushed.
# Based on the release workflow of obsidianmd/obsidian-sample-plugin
# (fetched 2026-10-01), with Node 24 and `npm ci`. Push a tag that matches the
# version in manifest.json, then review and publish the draft by hand.
name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Run tests
        run: npm test

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          gh release create "$tag" \
            --title="$tag" \
            --draft \
            main.js manifest.json styles.css
